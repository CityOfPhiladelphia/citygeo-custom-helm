---
{{- range .Values.nodePools }}
{{/* 1. Coerce the length into a strict integer variable */}}
{{- $zoneLength := int (len .zone) }}
{{/* 2. Compute the starting index safely using the variable */}}
{{- $startIndex := sub $zoneLength 2 }}
{{/* 3. Slice the string to get the last two characters (e.g., '1a') */}}
{{- $zoneSuffix := substr $startIndex $zoneLength .zone }}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: static-{{ if eq .arch "arm64" }}arm{{ else }}x86{{ end }}-{{ $zoneSuffix }}-{{ .instanceType }}
spec:
  # Static pool
  replicas: {{ .replicas | int }}
  template:
    metadata:
      # This label lets us identify and schedule
      # pods onto the static provisioned nodes
      labels:
        nodepool-category: static
    spec:
      {{ if eq .arch "arm64" }}
      taints:
        - key: kubernetes.io/arch
          value: arm64
          effect: NoSchedule
      {{ end }}
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [{{ quote .arch }}]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.k8s.aws/instance-encryption-in-transit-supported
          operator: In
          values: ["true"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # Instead of offering a variety of instance
        # types / families / categories, we
        # select a specific kind
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [{{ quote .instanceType }}]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [{{ quote .zone }}]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ if eq .arch "arm64" }}arm{{ else }}default{{ end }}
      expireAfter: 720h # 30 * 24h = 720h
      terminationGracePeriod: "360s"
---
{{- end }}
