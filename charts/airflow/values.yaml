dags:
  repo: ~
  branch: ~
envName: ~
clusterName: ~
dnsName: ~
k8sSecretStore:
  kind: ClusterSecretStore
  name: ~
secrets:
  valkeyPasswordSecretName: airflow-valkey-creds
  dbPasswordSecretName: airflow-db-creds
  adminPasswordSecretName: airflow-admin-login
  githubAppSecretName: ~
  githubAppPrivateKeySecretKey: ~
  githubAppInstallIdSecretKey: ~
  githubAppClientIdSecretKey: ~
  connectionsSecretName: airflow-connections
  # Secret with a "fernet-key" key. When unset, the Airflow chart generates a
  # random key on install, so reinstalling the release (e.g. renaming it)
  # replaces the key and makes encrypted Variables/connections in the DB unreadable.
  fernetKeySecretName: ~
# Helm options for the inner helm release
innerHelm:
  # Release name for the inner helm chart, must be different
  # from the release name of this outer helm chart
  releaseName: airflow
  timeout: 30m
  interval: 30m
  # Airflow often reports a failed install or upgrade that succeeds once its
  # pods settle, so by default Flux retries every retryInterval instead of
  # uninstalling or rolling back. Set strategy to
  # {name: RemediateOnFailure, retryInterval: null} to use the remediation
  # retries instead.
  install:
    retries: 1
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    retries: 1
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
airflow:
  image:
    repository: ~
    digest: ~
    tag: ~
  env:
    - name: AWS_REGION
      value: us-east-1
  auth:
    adminUsername: admin
  instanceName: airflow
  celery:
    replicas: 2
    resources: {}
    terminationGracePeriodSeconds: 2700
    concurrency: 2
    nodeSelectorExtra: ~
    env: []
  apiServer:
    replicas: 2
    resources: {}
  scheduler:
    replicas: 1
    resources: {}
  triggerer:
    replicas: 1
    resources: {}
  dagProcessor:
    replicas: 1
    resources: {}
  statsd:
    # Statsd metrics have high cardinality, so they are off by default.
    # Enabling statsd also creates a ServiceMonitor for it.
    enabled: false
    resources: {}
    cache: {}
pgbouncer:
  replicas: 1
  resources: {}
  nodeSelector: {}
  podDisruptionBudget:
    enabled: false
    config:
      maxUnavailable: 1
  metricsExporterSidecar:
    resources: {}
  # Scrape a few pool/connection metrics from the pgbouncer exporter sidecar
  podMonitor:
    enabled: false
aws:
  region: us-east-1
  kmsPolicyArn: ~
  elasticache:
    # Do not allow deleting Elasticache
    managementPolicies: ["Create", "LateInitialize", "Observe", "Update"]
    engineVersion: "9.0"
    import: false
    multiAZEnabled: false
    numNodeGroups: 1
    replicasPerNodeGroup: 0
  iam:
    managementPolicies: ["*"]
    forceDetachPolicies: false
    import: false
  s3:
    managementPolicies: ["*"]
    # Set to true to allow a bucket with files to be deleted
    forceDelete: false
    import: false
  rds:
    # Do not allow deleting the RDS
    managementPolicies: ["Create", "LateInitialize", "Observe", "Update"]
    deletionProtection: true
    import: false
    engineVersion: ~
    instanceClass: db.t4g.small
    allocatedStorage: 20
    maxAllocatedStorage: 40
    multiAZ: false
    backupRetentionPeriod: 0
    skipFinalSnapshot: true
    iops: ~
    storageThroughput: ~
