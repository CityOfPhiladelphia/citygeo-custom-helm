---
apiVersion: citygeo.phila.city/v1alpha1
kind: ValkeyCache
metadata:
  name: "{{ .Values.innerHelm.releaseName }}-{{ .Values.envName }}"
spec:
  managementPolicies:
    {{- toYaml .Values.aws.rds.managementPolicies | nindent 4 }}
  import: {{ .Values.aws.rds.import }}
  forProvider:
    description: Valkey Cluster for Airflow Celery Workers
    nodeType: cache.t4g.micro
    engineVersion: "{{ .Values.aws.elasticache.engineVersion }}"
    multiAzEnabled: {{ .Values.aws.elasticache.multiAZEnabled }}
    numNodeGroups: {{ .Values.aws.elasticache.numNodeGroups }}
    replicasPerNodeGroup: {{ .Values.aws.elasticache.replicasPerNodeGroup }}
    authTokenSecretRef:
      name: airflow-valkey-creds
      key: password
