---
apiVersion: elasticache.services.k8s.aws/v1alpha1
kind: ReplicationGroup
metadata:
  name: {{ .Release.Name }}-valkey
  # annotations:
  #   services.k8s.aws/adoption-policy: "adopt-or-create"
  #   services.k8s.aws/adoption-fields: |
  #     {"replicationGroupID": "{{ .name }}-{{ .Values.envName }}"}
spec:
  replicationGroupID: "{{ .Release.Name }}-{{ .Values.envName }}"
  description: Valkey Cluster for Airflow Celery Workers
  cacheNodeType: cache.t4g.micro
  kmsKeyID: "{{ .Values.aws.kmsKeyArn }}"
  engine: valkey
  engineVersion: "9.0"
  securityGroupIDs:
    - "{{ .Values.aws.elasticacheSgId }}"
  cacheSubnetGroupName: "{{ .Values.aws.elasticacheSubnetGroup }}"
  transitEncryptionEnabled: true
  atRestEncryptionEnabled: true
  authToken:
    name: airflow-valkey-creds
    key: password
---
apiVersion: services.k8s.aws/v1alpha1
kind: FieldExport
metadata:
  name: {{ .Release.Name }}-valkey
spec:
  from:
    path: ".status.nodeGroups[0].primaryEndpoint.address"
    resource:
      group: elasticache.services.k8s.aws
      kind: ReplicationGroup
      name: {{ .Release.Name }}-valkey
  to:
    name: ack-outputs
    namespace: {{ .Values.ackOutputsNamespace }}
    kind: secret
