---
apiVersion: rds.aws.m.upbound.io/v1beta1
kind: Instance
metadata:
  name: {{ .Values.innerHelm.releaseName }-postgres
  annotations:
    crossplane.io/external-name: "{{ .Values.innerHelm.releaseName }-{{ .Values.clusterName }}"
spec:
  managementPolicies: ["*"]
  forProvider:
    region: us-east-1 # Adjust to your AWS region
    engine: postgres
    engineVersion: "{{ .Values.aws.rds.engineVersion }}"
    identifier: "{{ .Values.innerHelm.releaseName }-{{ .Values.clusterName }}"
    instanceClass: db.t4g.small
    allocatedStorage: 20
    maxAllocatedStorage: {{ .Values.aws.rds.maxAllocatedStorage }}
    username: postgres
    passwordSecretRef:
      name: airflow-db-creds
      key: password
    storageEncrypted: true
    multiAz: {{ .Values.aws.rds.multiAZ }}
    storageType: gp3
    vpcSecurityGroupIds:
      - "{{ .Values.aws.rds.securityGroupID }}"
    dbSubnetGroupName: "{{ .Values.aws.rds.dbSubnetGroupName }}"
    kmsKeyId: "{{ .Values.aws.kmsKeyArn }}"
    enabledCloudwatchLogsExports:
      - postgresql
      - upgrade
    backupRetentionPeriod: {{ .Values.aws.rds.backupRetentionPeriod }}

  # Crossplane natively replaces ACK's FieldExport.
  # This automatically extracts the endpoint, username, etc., into a Kubernetes Secret.
  writeConnectionSecretToRef:
    name: crossplane-{{ .Release.Name }}-rds
