---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: {{ .Values.innerHelm.releaseName }}-s3
  {{- if .Values.aws.adoptAckResources }}
  annotations:
    services.k8s.aws/adoption-policy: "adopt-or-create"
    services.k8s.aws/adoption-fields: |
      {"arn": "arn.aws:iam::{{ .Values.aws.accountId }}:policy/{{ .Values.clusterName }}-{{ .Values.innerHelm.releaseName }-s3"}
  {{- end }}
spec:
  name: {{ .Values.clusterName }}-{{ .Release.Name }}-s3
  policyDocument: |
    {
      "Statement": [
          {
              "Action": [
                  "s3:DeleteObject",
                  "s3:GetObject",
                  "s3:ListBucket",
                  "s3:PutObject",
                  "s3:HeadObject"
              ],
              "Effect": "Allow",
              "Resource": [
                  "arn:aws:s3:::phl-{{ .Values.innerHelm.releaseName }-xcom-{{ .Values.clusterName }}",
                  "arn:aws:s3:::phl-{{ .Values.innerHelm.releaseName }-xcom-{{ .Values.clusterName }}/*",
                  "arn:aws:s3:::phl-{{ .Values.innerHelm.releaseName }-logs-{{ .Values.clusterName }}",
                  "arn:aws:s3:::phl-{{ .Values.innerHelm.releaseName }-logs-{{ .Values.clusterName }}/*",
                  "arn:aws:s3:::citygeo-airflow-databridge2",
                  "arn:aws:s3:::citygeo-airflow-databridge2/*",
                  "arn:aws:s3:::citygeo-airflow-databridge2-testing",
                  "arn:aws:s3:::citygeo-airflow-databridge2-testing/*",
                  "arn:aws:s3:::citygeo-dbt-artifacts-testing/*",
                  "arn:aws:s3:::citygeo-dbt-artifacts-testing",
                  "arn:aws:s3:::citygeo-dbt-artifacts/*",
                  "arn:aws:s3:::citygeo-dbt-artifacts",
                  "arn:aws:s3:::opendata-downloads",
                  "arn:aws:s3:::opendata-downloads/*",
                  "arn:aws:s3:::databridge-glacier",
                  "arn:aws:s3:::databridge-glacier/*",
                  "arn:aws:s3:::oit-server-inventory/*",
                  "arn:aws:s3:::oit-server-inventory"
              ]
          }
      ],
      "Version": "2012-10-17"
    }
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: {{ .Values.innerHelm.releaseName }}-irsa
  {{- if .Values.aws.adoptAckResources }}
  annotations:
    services.k8s.aws/adoption-policy: "adopt-or-create"
    services.k8s.aws/adoption-fields: |
      {"name": "{{ .Values.clusterName }}-{{ .Values.innerHelm.releaseName }-irsa"}
  {{- end }}
spec:
  name: {{ .Values.clusterName }}-{{ .Values.innerHelm.releaseName }-irsa
  description: Airflow IRSA
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
          {
              "Sid": "AllowClusterToAssume",
              "Effect": "Allow",
              "Principal": {
                  "Federated": "{{ .Values.aws.clusterOIDCArn }}"
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                  "StringLike": {
                      "{{ .Values.aws.clusterOIDCUrl }}:sub": "system:serviceaccount:{{ .Release.Namespace }}:*"
                  }
              }
          }
      ]
    }
  policies:
    - "{{ .Values.aws.kmsPolicyArn }}"
    - "arn:aws:iam::{{ .Values.aws.accountId }}:policy/{{ .Values.clusterName }}-{{ .Release.Name }}-s3"
