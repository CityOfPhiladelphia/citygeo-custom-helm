
# How to manage values files. Ref: https://fluxcd.io/docs/guides/helmreleases/#refer-to-values-inside-the-chart
# How to inject values: https://fluxcd.io/docs/guides/helmreleases/#cloud-storage
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Values.innerHelm.releaseName }}
spec:
  releaseName: {{ .Values.innerHelm.releaseName }}
  targetNamespace: {{ .Release.Namespace }}
  # Airflow needs a huge timeout because when worker
  # pods get replaced they take a long time
  timeout: {{ .Values.innerHelm.timeout }}
  interval: {{ .Values.innerHelm.interval }}
  chart:
    spec:
      chart: airflow
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: airflow
        namespace: flux-system
  install:
    {{- with .Values.innerHelm.install.strategy }}
    strategy:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    remediation:
      retries: {{ .Values.innerHelm.install.retries }}
  upgrade:
    force: true
    {{- with .Values.innerHelm.upgrade.strategy }}
    strategy:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    remediation:
      retries: {{ .Values.innerHelm.upgrade.retries }}
  # https://artifacthub.io/packages/helm/apache-airflow/airflow?modal=values
  values:
    executor: CeleryExecutor
    allowPodLaunching: true
    # apiSecretKey, jwtSecret, webserverSecret?
    apiSecretKeySecretName: airflow-custom-api-secret
    jwtSecretName: airflow-custom-jwt-secret
    {{- with .Values.secrets.fernetKeySecretName }}
    fernetKeySecretName: {{ . }}
    {{- end }}
    data:
      # not needed cause pgbouncer will be used instead.
      metadataSecretName: {{ .Release.Name }}-db
      brokerUrlSecretName: {{ .Release.Name }}-valkey
    # Get all secrets from airflow-connections secret
    extraEnvFrom: |-
      - secretRef:
          name: '{{ .Values.secrets.connectionsSecretName }}'

    # Restart airflow pods when secrets are updated
    airflowPodAnnotations:
      secret.reloader.stakater.com/auto: "true"

    # https://airflow.apache.org/docs/helm-chart/stable/production-guide.html#pgbouncer
    # necessary because airflow uses a lot of connections.
    pgbouncer:
      enabled: true
      replicas: {{ .Values.pgbouncer.replicas }}
      resources:
        {{- toYaml .Values.pgbouncer.resources | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.pgbouncer.nodeSelector | nindent 8 }}
      podDisruptionBudget:
        {{- toYaml .Values.pgbouncer.podDisruptionBudget | nindent 8 }}
      #maxClientConn: 230
      metadataPoolSize: 100
      resultBackendPoolSize: 30
      configSecretName: {{ .Release.Name }}-pgbouncer-config
      metricsExporterSidecar:
        statsSecretName: {{ .Release.Name }}-pgbouncer-stats
        resources:
          {{- toYaml .Values.pgbouncer.metricsExporterSidecar.resources | nindent 10 }}
    env:
      - name: AIRFLOW_CONN_SMTP_DEFAULT
        value: >-
          {
            "conn_type": "smtp",
            "host": "relay.city.phila.local",
            "port": 25,
            "extra": {
              "disable_ssl": true,
              "disable_tls": true,
              "from_email": "airflow-dag-alerts@phila.gov",
              "subject_template": "/opt/airflow/dags/repo/templates/email_subject.txt",
              "html_content_template": "/opt/airflow/dags/repo/templates/email_body.html"
            }
          }
      {{- toYaml .Values.airflow.env | nindent 6 }}
    volumes:
      - name: github-app-ssh-key
        secret:
          secretName: {{ .Values.secrets.githubAppSecretName }}
          items:
            - key: {{ .Values.secrets.githubAppPrivateKeySecretKey }}
              path: gh_app_priv_key
              mode: 0400
    images:
      airflow:
        {{- toYaml .Values.airflow.image | nindent 8}}
    workers:
      celery:
        replicas: {{ .Values.airflow.celery.replicas }}
        terminationGracePeriodSeconds: {{ .Values.airflow.celery.terminationGracePeriodSeconds }}
        resources:
          {{- toYaml .Values.airflow.celery.resources | nindent 10 }}
        podDisruptionBudget:
          enabled: true
          config:
            minAvailable: 1
        priorityClassName: app-high
        nodeSelector:
          # Airflow is x86/amd64 only
          kubernetes.io/arch: amd64
          # Celery workers in must be on-demand
          karpenter.sh/capacity-type: on-demand
          # to reduce data transfer costs writing to databridge
          {{- if .Values.airflow.celery.nodeSelectorExtra }}
            {{- toYaml .Values.airflow.celery.nodeSelectorExtra | nindent 10 }}
          {{- end }}
        env:
          {{- toYaml .Values.airflow.celery.env | nindent 10 }}
        serviceAccount:
          create: false
          name: "{{ .Values.innerHelm.releaseName }}-irsa"
        extraVolumeMounts:
          - name: venvs
            mountPath: /home/airflow/venvs # Mount path inside the container
        extraVolumes: 
         - name: venvs
           persistentVolumeClaim:
              claimName: {{ .Values.innerHelm.releaseName }}-venvs
        # Logs are shipped to S3 and deleted locally, so workers don't need
        # a log volume. This also makes workers a Deployment, not a StatefulSet.
        persistence:
          enabled: false
      logGroomerSidecar:
        enabled: false
    scheduler:
      replicas: {{ .Values.airflow.scheduler.replicas }}
      resources:
        {{- toYaml .Values.airflow.scheduler.resources | nindent 8 }}
      podDisruptionBudget:
        enabled: true
        config:
          maxUnavailable: 1
      nodeSelector:
        # Airflow is x86/amd64 only
        kubernetes.io/arch: amd64
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              component: scheduler
          maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      logGroomerSidecar:
        enabled: false
    apiServer:
      replicas: {{ .Values.airflow.apiServer.replicas }}
      resources:
        {{- toYaml .Values.airflow.apiServer.resources | nindent 8 }}
      allowPodLogReading: true
      # Bug: https://github.com/apache/airflow/issues/52270
      env:
        - name: AIRFLOW__API__WORKERS
          value: "1"
      podDisruptionBudget:
        enabled: true
        config:
          maxUnavailable: 1
      nodeSelector:
        # Airflow is x86/amd64 only
        kubernetes.io/arch: amd64
      serviceAccount:
        create: false
        name: "{{ .Values.innerHelm.releaseName }}-irsa"
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              component: api-server
          maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
    triggerer:
      replicas: {{ .Values.airflow.triggerer.replicas }}
      resources:
        {{- toYaml .Values.airflow.triggerer.resources | nindent 8 }}
      podDisruptionBudget:
        # Have to disable pdb because replicas doesn't actually work
        enabled: false
        config:
          maxUnavailable: ~
          minAvailable: 1
      # Logs are shipped to S3 and deleted locally, so the triggerer doesn't need
      # a log volume. This also makes it a Deployment, not a StatefulSet.
      persistence:
        enabled: false
      nodeSelector:
        # Airflow is x86/amd64 only
        kubernetes.io/arch: amd64
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              component: triggerer
          maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      logGroomerSidecar:
        enabled: false
    dagProcessor:
      replicas: {{ .Values.airflow.dagProcessor.replicas }}
      resources:
        {{- toYaml .Values.airflow.dagProcessor.resources | nindent 8 }}
      podDisruptionBudget:
        enabled: true
        config:
          maxUnavailable: 1
      nodeSelector:
        # Airflow is x86/amd64 only
        kubernetes.io/arch: amd64
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              component: dag-processor
          maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
      logGroomerSidecar:
        enabled: false
    # https://airflow.apache.org/docs/apache-airflow/stable/cli-and-env-variables-ref.html#clean
    databaseCleanup:
      enabled: true
      # Don't allow Karpenter to kill jobs prematurely
      podAnnotations:
        karpenter.sh/do-not-disrupt: "true"
      nodeSelector:
        # Airflow is x86/amd64 only
        kubernetes.io/arch: amd64
      retentionDays: 90
      tables:
        - _xcom_archive
        - asset_event
        - callback_request
        - celery_taskmeta
        - celery_tasksetmeta
        - dag
        - dag_run
        - dag_version
        - deadline
        - import_error
        - job
        - log
        - sla_miss
        - task_instance
        - task_instance_history
        - task_reschedule
        - trigger
        - xcom
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 30m
          memory: 256Mi
    postgresql:
      enabled: false
    config:
      api:
        expose_config: "True"
        instance_name: "{{ .Values.airflow.instanceName }}"
        base_url: "https://{{ .Values.dnsName }}"
      # https://airflow.apache.org/docs/apache-airflow/stable/configurations-ref.html
      core:
        default_timezone: "America/New_York"
        # Workers and the triggerer are Deployments (no persistence), so their pod
        # hostnames don't resolve in DNS. Record the pod IP instead, so the api
        # server can fetch logs of running tasks from the worker's log server.
        hostname_callable: airflow.utils.net.get_host_ip_address
        dagbag_import_timeout: 90.0
        # max_active_tasks_per_dag: 20
        # max_active_runs_per_dag: 20
        # same reasoning as min_file_process_interval below.
        min_serialized_dag_update_interval: 1500
        # Sets up S3 object storage xcom backend
        xcom_backend: airflow.providers.common.io.xcom.backend.XComObjectStorageBackend
        # Determines how many times a task can be parallelized and split out
        # It's useful to have this number bigger than the amount of tables we have in databridge
        max_map_length: 1536
      email:
        from_email: "DagNabbit <airflow-dag-alerts@phila.gov>"
        email_backend: airflow.utils.email.send_email_smtp
        subject_template: /opt/airflow/dags/repo/templates/email_subject.txt
        html_content_template: /opt/airflow/dags/repo/templates/email_body.html
      celery:
        worker_concurrency: {{ .Values.airflow.celery.concurrency }}
      logging:
        remote_logging: true
        remote_base_log_folder: "s3://phl-{{ .Values.innerHelm.releaseName }}-logs-{{ .Values.clusterName }}"
        # Logs are kept in S3, so remove the local copy once uploaded.
        # Otherwise worker log volumes fill up, since log groomers are disabled.
        delete_local_logs: "True"
      common.io:
        # Sets up S3 object storage xcom backend
        xcom_objectstorage_path: "s3://phl-{{ .Values.innerHelm.releaseName }}-xcom-{{ .Values.clusterName }}/backend"
        # Only store in bucket if xcom is bigger than 100Kb
        xcom_objectstorage_threshold: "102400"
        xcom_objectstorage_compression: gzip
      dag_processor:
        # We have to hit re-parse or trigger a re-parse via github
        # Prevents dag_processor from blowing up on our dag factory
        min_file_process_interval: 1500
        # Disable parallelization
        parsing_processes: 1
      # https://airflow.apache.org/docs/apache-airflow/2.6.0/configurations-ref.html#config-database-sql-alchemy-pool-size
      database:
        sql_alchemy_pool_size: 20
        sql_alchemy_max_overflow: 25
    logs:
      persistence:
        enabled: false
        # size: 10Gi
        # storageClassName: efs-sc
    redis:
      enabled: false
    dags:
      persistence:
        enabled: false
      gitSync:
        enabled: true
        resources:
          limits:
            memory: "40Mi"
          requests:
            cpu: "10m"
            memory: "40Mi"
        repo: {{ .Values.dags.repo }}
        rev: HEAD
        ref: {{ .Values.dags.branch }}
        branch: {{ .Values.dags.branch }}
        period: 60s
        subPath: ""
        extraVolumeMounts:
          - name: github-app-ssh-key
            mountPath: "/etc/github-app-ssh-key"
            readOnly: true
        # Airflow doesn't offer a convenient way to pass
        # these github app env variables, but git-sync
        # does support them: https://github.com/kubernetes/git-sync
        env:
          - name: GITSYNC_GITHUB_APP_INSTALLATION_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.githubAppSecretName }}
                key: {{ .Values.secrets.githubAppInstallIdSecretKey }}
          - name: GITSYNC_GITHUB_APP_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.githubAppSecretName }}
                key: {{ .Values.secrets.githubAppClientIdSecretKey }}
          - name: GITSYNC_GITHUB_APP_PRIVATE_KEY_FILE
            value: /etc/github-app-ssh-key/gh_app_priv_key
    statsd:
      # Statsd metrics seem interesting, but
      # they have way too high cardinality
      enabled: {{ .Values.airflow.statsd.enabled }}
      resources:
        {{- toYaml .Values.airflow.statsd.resources | nindent 8 }}
      cache:
        {{- toYaml .Values.airflow.statsd.cache | nindent 8 }}
    # https://airflow.apache.org/docs/helm-chart/1.18.0/#installing-the-chart-with-argo-cd-flux-rancher-or-terraform
    createUserJob:
      # Don't allow Karpenter to kill jobs prematurely
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.adminPasswordSecretName }}
              key: password
      defaultUser:
        username: {{ .Values.airflow.auth.adminUsername }}
        password: "$(ADMIN_PASSWORD)"
      nodeSelector:
        # Airflow is x86/amd64 only
        kubernetes.io/arch: amd64
      useHelmHooks: false
      applyCustomEnv: false
    migrateDatabaseJob:
      # Don't allow Karpenter to kill jobs prematurely
      annotations:
        karpenter.sh/do-not-disrupt: "true"
      nodeSelector:
        # Airflow is x86/amd64 only
        kubernetes.io/arch: amd64
      useHelmHooks: false
      applyCustomEnv: false
