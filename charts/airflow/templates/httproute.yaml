---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: eg-internal
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "{{ dnsName }}"
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-api-server
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-https-redirect
spec:
  parentRefs:
    - name: eg-internal
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "{{ dnsName }}"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
